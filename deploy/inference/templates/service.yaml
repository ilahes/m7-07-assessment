{{/* deploy/inference/templates/service.yaml */}}
apiVersion: v1
kind: Service
metadata:
  name: rec-inference
  namespace: {{ .Release.Namespace }}
  labels:
    app: rec-inference
    app.kubernetes.io/name: rec-inference
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: rec-inference
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 8080
