{{/* deploy/inference/templates/deployment.yaml */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rec-inference
  namespace: {{ .Release.Namespace }}
  labels:
    app: rec-inference
    app.kubernetes.io/name: rec-inference
    app.kubernetes.io/version: {{ .Values.modelVersion | quote }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rec-inference
  template:
    metadata:
      labels:
        app: rec-inference
        app.kubernetes.io/name: rec-inference
        version: {{ .Values.modelVersion | quote }}
      annotations:
        # Force rolling restart when config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # ── Security ──────────────────────────────────────────────
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}

      # ── Init container: pull model artifact from GCS ──────────
      initContainers:
        - name: model-artifact-init
          image: google/cloud-sdk:alpine
          command:
            - sh
            - -c
            - |
              echo "Downloading model artifacts for version {{ .Values.modelVersion }} ..."
              gsutil cp {{ .Values.modelArtifact.gcsBucket }}/rec-model-{{ .Values.modelVersion }}.onnx \
                {{ .Values.modelArtifact.mountPath }}/model.onnx
              gsutil cp {{ .Values.modelArtifact.gcsBucket }}/rec-index-{{ .Values.modelVersion }}.faiss \
                {{ .Values.modelArtifact.mountPath }}/index.faiss
              echo "Artifacts downloaded."
          volumeMounts:
            - name: model-storage
              mountPath: {{ .Values.modelArtifact.mountPath }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}

      # ── Main container ────────────────────────────────────────
      containers:
        - name: rec-inference
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment variables ────────────────────────────
          env:
            - name: MODEL_ARTIFACT_PATH
              value: {{ .Values.env.MODEL_ARTIFACT_PATH | quote }}
            - name: MODEL_VERSION
              value: {{ .Values.env.MODEL_VERSION | quote }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
            - name: PRODUCT_CATALOG_URL
              value: {{ .Values.env.PRODUCT_CATALOG_URL | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}

          # ── Probes ───────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          # ── Resources ────────────────────────────────────────
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}

          # ── Security ─────────────────────────────────────────
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}

          # ── Volume mounts ────────────────────────────────────
          volumeMounts:
            - name: model-storage
              mountPath: {{ .Values.modelArtifact.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp

      # ── Volumes ───────────────────────────────────────────────
      volumes:
        - name: model-storage
          emptyDir: {}          # populated by init container from GCS
        - name: tmp
          emptyDir: {}          # writable scratch space for read-only root FS
