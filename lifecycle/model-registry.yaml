# ──────────────────────────────────────────────
# Registry gates: conditions that must pass for state transitions
# ──────────────────────────────────────────────
promotion_gates:
  candidate_to_staging:
    - ndcg_at_10 >= 0.38
    - mrr >= 0.22
    - catalog_coverage_at_10 >= 0.35
    - cold_start_ndcg_at_10 >= 0.21
    - bias_check == passed
    - fairness_check == passed
    - onnx_export_parity_check == passed   # cosine sim delta < 1e-4

  staging_to_production:
    - smoke_test == passed
    - load_test_p95_ms <= 120
    - load_test_error_rate_pct <= 0.5
    - manual_approval == true
    - ab_test_ctr_lift > 0                # any positive lift in online test
    - ab_test_p_value <= 0.05

  production_to_archived:
    - superseded_by: required             # must name a production version

  any_to_rolled_back:
    - rollback_reason: required
    - rolled_back_by: required
    - rolled_back_at: required
